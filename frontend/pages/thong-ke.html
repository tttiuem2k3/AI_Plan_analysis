<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thống kê sản xuất</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

  <!-- Reuse the same UI system as Đơn hàng / Kế hoạch -->
  <link rel="stylesheet" href="../assets/css/don-hang.css">

  <style>
    .kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;padding:14px}
    .kpi{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 14px 12px}
    .kpi .label{color:var(--muted);font-weight:800;font-size:12px}
    .kpi .value{margin-top:8px;font-weight:900;font-size:22px;color:var(--text)}
    .kpi .hint{margin-top:6px;color:var(--muted);font-weight:700;font-size:12px}

    .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px}
    .filters .field{display:flex;flex-direction:column;gap:6px}
    .filters .field label{font-size:12px;color:var(--muted);font-weight:800}
    .filters input,.filters select{border:1px solid var(--border);border-radius:10px;padding:10px 10px;font-size:14px;outline:none;background:#fff;min-width:220px}

    .chart-shell{padding:14px}
    .chart-placeholder{border:1px dashed var(--border);border-radius:14px;background:#fcfcfd;height:260px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:800}

    @media (max-width: 1100px){
      .kpi-grid{grid-template-columns:repeat(2,minmax(220px,1fr))}
    }
    @media (max-width: 640px){
      .kpi-grid{grid-template-columns:1fr}
      .filters input,.filters select{min-width:0;width:100%}
      .page-head{flex-direction:column;align-items:flex-start}
      .head-actions{width:100%}
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-head">
      <div class="page-title">
        <div class="h1">Thống kê sản xuất</div>
      </div>

      <div class="head-actions">
        <button class="btn ghost" id="btnReload" title="Tải lại">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
      </div>
    </div>

    <div class="card">
      <div class="filters">
        <div class="field">
          <label>Từ ngày</label>
          <input type="date" id="fromDate" />
        </div>
        <div class="field">
          <label>Đến ngày</label>
          <input type="date" id="toDate" />
        </div>
        <div class="field">
          <label>Nhóm</label>
          <select id="groupBy">
            <option value="day">Theo ngày</option>
            <option value="week">Theo tuần</option>
            <option value="month">Theo tháng</option>
          </select>
        </div>
        <div style="flex:1 1 auto"></div>
        <button class="btn primary" id="btnApply">
          <i class="bi bi-funnel"></i>
          Áp dụng
        </button>
      </div>

      <div class="kpi-grid">
        <div class="kpi">
          <div class="label">Sản lượng kế hoạch</div>
          <div class="value" id="kpiPlanQty">—</div>
          <div class="hint">Tổng theo khoảng thời gian</div>
        </div>
        <div class="kpi">
          <div class="label">Sản lượng thực tế</div>
          <div class="value" id="kpiActualQty">—</div>
          <div class="hint">Dữ liệu đang tích hợp</div>
        </div>
        <div class="kpi">
          <div class="label">Tỷ lệ hoàn thành</div>
          <div class="value" id="kpiCompletion">—</div>
          <div class="hint">Thực tế / Kế hoạch</div>
        </div>
        <div class="kpi">
          <div class="label">Số đơn trễ</div>
          <div class="value" id="kpiLate">—</div>
          <div class="hint">Theo ngày giao</div>
        </div>
      </div>

      <div class="chart-shell">
        <div class="section-head">
          <div class="h2">Xu hướng sản xuất</div>
        </div>
        <div class="chart-placeholder">(Khung biểu đồ – sẽ nối dữ liệu sau)</div>
      </div>

      <div class="chart-shell">
        <div class="section-head">
          <div class="h2">Chi tiết</div>
        </div>
        <div class="table-wrap">
          <table class="table" style="min-width: 980px;">
            <thead>
              <tr>
                <th class="th-blue" style="width:160px;">Ngày</th>
                <th class="th-blue">Kế hoạch</th>
                <th class="th-blue">Thực tế</th>
                <th class="th-blue">Chênh lệch</th>
                <th class="th-blue" style="width:200px;">Ghi chú</th>
              </tr>
            </thead>
            <tbody id="tbDetail">
              <!-- Filled later -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Minimal placeholder interactions (no backend wiring yet)
    const $ = (id) => document.getElementById(id);
    function fillDemo(){
      $("kpiPlanQty").textContent = "—";
      $("kpiActualQty").textContent = "—";
      $("kpiCompletion").textContent = "—";
      $("kpiLate").textContent = "—";
      $("tbDetail").innerHTML = "";
    }
    $("btnReload").addEventListener("click", fillDemo);
    $("btnApply").addEventListener("click", fillDemo);
    fillDemo();
  </script>
</body>
</html>
